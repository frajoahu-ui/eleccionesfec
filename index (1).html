<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#bbd6f0">
  <meta name="description" content="Consulta el lugar y la mesa de votación por carrera para las elecciones FEC UdeC 2026.">
  <title>Consulta tu mesa | Elecciones FEC UdeC 2026</title>
  <style>
    :root { --green:#bbd6f0; --green2:#a3c6e8; --ink:#223c6a; --muted:#223c6a; --line:#d5e3f1; --bg:#f3f7fb; --white:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; }
    header { background:#bbd6f0; color:#223c6a; padding:28px 20px 34px; }
    .wrap { width:min(980px,100% - 32px); margin:0 auto; }
    .brand { display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:28px; }
    .brand-left { display:flex; align-items:center; gap:12px; }
    .logo { width:44px; height:44px; display:grid; place-items:center; background:var(--green); color:#fff; border-radius:12px; font-size:24px; font-weight:800; flex:none; }
    .brand strong { display:block; letter-spacing:.02em; }
    .brand-left span { display:block; color:#223c6a; font-size:.9rem; }
    .tricel-logo { display:block; flex:none; max-width:100%; }
    .tricel-logo img { display:block; height:150px; width:auto; max-width:100%; }
    h1 { font-size:clamp(1.8rem,5vw,2.6rem); line-height:1.1; margin:0 0 12px; letter-spacing:-.03em; }
    .intro { max-width:570px; margin:0; color:#223c6a; }
    main { margin-top:-18px; padding-bottom:36px; }
    .panel { background:var(--white); border:1px solid var(--line); border-radius:18px; padding:24px; box-shadow:0 10px 30px #223c6a14; }
    label { display:block; font-weight:700; margin-bottom:8px; }
    .searchrow { display:flex; gap:10px; }
    input { min-width:0; flex:1; padding:13px 14px; border:1px solid #a3c6e8; border-radius:10px; font:inherit; color:var(--ink); background:#fff; }
    input:focus { outline:3px solid #bbd6f0; border-color:var(--green2); }
    button { border:0; border-radius:10px; padding:13px 17px; font:inherit; font-weight:700; background:var(--green); color:#223c6a; cursor:pointer; }
    button:hover { background:var(--green2); }
    .hint { color:var(--muted); font-size:.88rem; margin:9px 0 0; }
    .results { margin-top:18px; display:grid; gap:14px; }
    .result { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .box { border:1px solid var(--line); border-radius:14px; background:#fff; overflow:hidden; min-height:260px; }
    .info { padding:18px; }
    .info h2 { margin:0 0 14px; font-size:1.1rem; }
    .tag { display:inline-block; border-radius:6px; padding:4px 8px; font-size:.78rem; font-weight:750; background:#e3eef9; color:#223c6a; margin-bottom:12px; }
    .field { display:grid; grid-template-columns: minmax(100px, .7fr) 1.3fr; gap:12px; padding:11px 0; border-top:1px solid #e3edf6; }
    .field span { color:var(--muted); font-size:.9rem; }
    .field strong { overflow-wrap:anywhere; }
    .mapbox { position:relative; background:#e6eff8; display:flex; flex-direction:column; }
    .mapbox iframe { flex:1; width:100%; min-height:260px; border:0; display:block; }
    .maplink { position:absolute; left:10px; bottom:10px; display:inline-block; padding:8px 12px; border-radius:8px; background:var(--green); color:#223c6a; font-size:.85rem; font-weight:700; text-decoration:none; box-shadow:0 2px 8px #0003; }
    .maplink:hover { background:var(--green2); }
    .message { border-radius:10px; background:#eef4fa; color:#223c6a; padding:14px; }
    .count { font-size:.9rem; color:var(--muted); margin:0; }
    footer { text-align:center; padding:0 16px 28px; color:var(--muted); font-size:.84rem; }
    .notice { margin-top:18px; border-left:3px solid #bbd6f0; padding:10px 12px; color:var(--muted); font-size:.85rem; }
    @media(max-width:700px) { .result { grid-template-columns:1fr; } .box { min-height:0; } .mapbox iframe { min-height:260px; } }
    @media(max-width:540px) { .panel { padding:18px; } .searchrow { flex-direction:column; } button { width:100%; } .field { grid-template-columns:1fr; gap:2px; } header { padding-top:22px; } .tricel-logo img { height:90px; } .brand-left span { display:none; } }
  </style>
</head>

const input = document.getElementById('career');
const datalist = document.getElementById('careers');
const results = document.getElementById('results');
// Ignora mayúsculas, tildes/diéresis y espacios sobrantes (Ing = ing = íng)
const normalize = value => String(value).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const UNIVERSIDAD = 'Universidad de Concepción, Concepción, Chile';
function mapEmbedUrl(place) {
  const clean = place.replace(/,?\s*\d+(er|do|ro|to)?\s*piso/i, '');
  return 'https://www.google.com/maps?q=' + encodeURIComponent(clean + ', ' + UNIVERSIDAD) + '&output=embed';
}
assignments.forEach(item => {
  const option = document.createElement('option');
  option.value = item['Carrera'];
  datalist.appendChild(option);
});
function showResults() {
  const query = normalize(input.value);
  results.replaceChildren();
  if (!query) {
    results.innerHTML = '<div class="message">Escribe el nombre de tu carrera para consultar la asignación.</div>';
    return;
  }
  const matches = assignments.filter(item => normalize(item['Carrera']).includes(query));
  if (!matches.length) {
    results.innerHTML = '<div class="message">No encontramos una carrera con ese texto. Revisa la escritura o prueba con una parte diferente del nombre.</div>';
    return;
  }
  const count = document.createElement('p');
  count.className = 'count';
  count.textContent = matches.length === 1 ? 'Se encontró 1 carrera.' : `Se encontraron ${matches.length} carreras.`;
  results.appendChild(count);
  matches.forEach(item => {
    const card = document.createElement('article');
    card.className = 'result';

    // Cuadrado izquierdo: información
    const info = document.createElement('div');
    info.className = 'box info';
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = 'Carrera';
    const title = document.createElement('h2');
    title.textContent = item['Carrera'];
    info.append(tag, title);
    [['Lugar de votación', item['Lugar de votación']], ['Nombre de la mesa', item['Nombre de la mesa']]].forEach(([label, value]) => {
      const row = document.createElement('div');
      row.className = 'field';
      const name = document.createElement('span');
      name.textContent = label;
      const content = document.createElement('strong');
      content.textContent = value;
      row.append(name, content);
      info.appendChild(row);
    });

    // Cuadrado derecho: mapa de Google
    const mapbox = document.createElement('div');
    mapbox.className = 'box mapbox';
    const frame = document.createElement('iframe');
    frame.src = mapEmbedUrl(item['Lugar de votación']);
    frame.title = 'Mapa de ' + item['Lugar de votación'];
    frame.loading = 'lazy';
    frame.referrerPolicy = 'no-referrer-when-downgrade';
    frame.allowFullscreen = true;
    mapbox.appendChild(frame);
    if (item['Maps']) {
      const link = document.createElement('a');
      link.className = 'maplink';
      link.href = item['Maps'];
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = 'Abrir en Google Maps';
      mapbox.appendChild(link);
    }

    card.append(info, mapbox);
    results.appendChild(card);
  });
}
document.getElementById('search').addEventListener('click', showResults);
input.addEventListener('keydown', event => { if (event.key === 'Enter') showResults(); });
input.addEventListener('input', () => { if (!input.value.trim()) results.replaceChildren(); });
</script>
